<h2>Add New Category</h2>

<form method="POST" enctype="multipart/form-data">

  <input type="text" name="name" placeholder="Category name" required>

  <!-- NEW -->
  <input type="file" name="image" accept="image/*" required>

  <button type="submit">Add</button>

</form>


<hr>
<h3>Existing Categories</h3>

{% for cat in categories %}
  <div class="category-item">
    <img src="{{ url_for('static', filename=cat.image or 'images/categories/default.png') }}" 
         width="80" height="80">
    <span>{{ cat.name }}</span>

    <!-- Edit form -->
    <form method="POST" enctype="multipart/form-data" action="{{ url_for('edit_category', category_id=cat.id) }}">
      <input type="text" name="name" value="{{ cat.name }}" required>
      <input type="file" name="image" accept="image/*">
      <button type="submit">Save</button>
    </form>

    <!-- Optional: delete -->
    <form method="POST" action="{{ url_for('delete_category', category_id=cat.id) }}" style="display:inline;">
      <button type="submit" onclick="return confirm('Delete this category?')">Delete</button>
    </form>
  </div>
{% endfor %}
