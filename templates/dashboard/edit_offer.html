<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Edit Offer</title>

  <style>
    .dashboard-page {
      max-width: 600px;
      margin: 40px auto;
      padding: 20px;
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,.1);
    }

    .form-group {
      margin-bottom: 15px;
    }

    .form-control {
      width: 100%;
      padding: 8px;
      box-sizing: border-box;
    }

    .form-actions {
      display: flex;
      gap: 10px;
    }

    .btn {
      padding: 8px 16px;
      border-radius: 4px;
      text-decoration: none;
      cursor: pointer;
    }

    .btn-primary {
      background: #007bff;
      color: #fff;
      border: none;
    }

    .btn-secondary {
      background: #6c757d;
      color: #fff;
    }

    a.button,
    button {
      padding: 8px 14px;
      background: #3498db;
      color: #fff;
      border: none;
      border-radius: 4px;
      text-decoration: none;
      cursor: pointer;
    }

    a.button:hover,
    button:hover {
      background: #2980b9;
    }

    .offer-item-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px;
      border-bottom: 1px solid #eee;
      cursor: pointer;
    }

    #offerItemsList {
      max-height: 350px;
      overflow-y: auto;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 10px;
    }
  </style>
</head>

<body>

<div class="dashboard-page">

  <a href="{{ url_for('restaurant_dashboard') }}" class="button">
    ← Back to Dashboard
  </a>

  <h2>✏️ Edit Offer – {{ restaurant.name }}</h2>

  <form method="POST">

    <!-- TITLE -->
    <div class="form-group">
      <label>Offer Title</label>

      <input
        type="text"
        name="title"
        class="form-control"
        value="{{ offer.title }}"
        required
      >
    </div>


    <!-- DESCRIPTION -->
    <div class="form-group">
      <label>Description</label>

      <textarea
        name="description"
        class="form-control"
      >{{ offer.description or '' }}</textarea>
    </div>


    <!-- OFFER TYPE -->
    <div class="form-group">
      <label>Offer Type</label>

      <select
        name="offer_type"
        id="offer_type"
        class="form-control"
        required
      >

        <option
          value="flat"
          {% if offer.offer_type == "flat" %}selected{% endif %}
        >
          Flat Discount
        </option>

        <option
          value="percent"
          {% if offer.offer_type == "percent" %}selected{% endif %}
        >
          Percentage Discount
        </option>

        <option
          value="free_delivery"
          {% if offer.offer_type == "free_delivery" %}selected{% endif %}
        >
          Free Delivery
        </option>

      </select>
    </div>


    <!-- OFFER VALUE -->
    <div
      class="form-group"
      id="offer_value_group"
    >

      <label>Offer Value</label>

      <input
        type="number"
        step="0.01"
        name="offer_value"
        class="form-control"
        value="{{ offer.offer_value or 0 }}"
      >
    </div>


    <!-- ==============================
         OFFER SCOPE
    =============================== -->

    <div
      class="form-group"
      id="offer_scope_group"
    >

      <label>
        <strong>Apply Offer To</strong>
      </label>

      <div style="margin-top:10px;">

        <label style="margin-right:20px;">

          <input
            type="radio"
            name="offer_scope"
            value="all_items"
            onchange="toggleItemSelection()"

            {% if offer.offer_scope == "all_items" %}
              checked
            {% endif %}
          >

          All Items
        </label>


        <label>

          <input
            type="radio"
            name="offer_scope"
            value="selected_items"
            onchange="toggleItemSelection()"

            {% if offer.offer_scope == "selected_items" %}
              checked
            {% endif %}
          >

          Selected Items
        </label>

      </div>

    </div>


    <!-- ==============================
         SELECT MENU ITEMS
    =============================== -->

    <div
      class="form-group"
      id="selected_items_box"
      style="display:none;"
    >

      <label>
        <strong>Select Menu Items</strong>
      </label>


      <input
        type="text"
        id="itemSearch"
        class="form-control"
        placeholder="Search menu item..."
        onkeyup="filterOfferItems()"
        style="margin-bottom:12px;"
      >


      <div id="offerItemsList">

        {% for item in menu_items %}

          <label
            class="offer-item-row"
            data-name="{{ item.name|lower }}"
          >

            <input
              type="checkbox"
              name="selected_items"
              value="{{ item.id }}"

              {% if item in offer.selected_items %}
                checked
              {% endif %}
            >


            <div style="flex:1;">

              <strong>
                {{ item.name }}
              </strong>

              {% if item.category %}

                <div
                  style="
                    font-size:12px;
                    color:#777;
                    margin-top:2px;
                  "
                >
                  {{ item.category }}
                </div>

              {% endif %}

            </div>


            {% if item.price is not none %}

              <span>
                ₹{{ "%.0f"|format(item.price) }}
              </span>

            {% endif %}

          </label>

        {% else %}

          <p style="color:#777;">
            No menu items found.
          </p>

        {% endfor %}

      </div>

    </div>


    <!-- MINIMUM ORDER -->
    <div class="form-group">
      <label>Minimum Order Amount</label>

      <input
        type="number"
        step="0.01"
        name="min_order_amount"
        class="form-control"
        value="{{ offer.min_order_amount or 0 }}"
      >
    </div>


    <!-- START DATE -->
    <div class="form-group">
      <label>Start Date</label>

      <input
        type="date"
        name="start_date"
        class="form-control"
        value="{{ offer.start_date.strftime('%Y-%m-%d') if offer.start_date else '' }}"
      >
    </div>


    <!-- END DATE -->
    <div class="form-group">
      <label>End Date</label>

      <input
        type="date"
        name="end_date"
        class="form-control"
        value="{{ offer.end_date.strftime('%Y-%m-%d') if offer.end_date else '' }}"
      >
    </div>


    <!-- STATUS -->
    <div class="form-group">
      <label>Status</label>

      <select
        name="is_active"
        class="form-control"
      >

        <option
          value="1"
          {% if offer.is_active %}selected{% endif %}
        >
          Active
        </option>

        <option
          value="0"
          {% if not offer.is_active %}selected{% endif %}
        >
          Inactive
        </option>

      </select>
    </div>


    <!-- ACTIONS -->
    <div class="form-actions">

      <button
        type="submit"
        class="btn btn-primary"
      >
        Update Offer
      </button>

      <a
        href="{{ url_for('manage_offers', restaurant_id=restaurant.id) }}"
        class="btn btn-secondary"
      >
        Cancel
      </a>

    </div>

  </form>

</div>


<script>

function toggleOfferFields() {

    const type =
        document.getElementById("offer_type").value;

    const valueGroup =
        document.getElementById("offer_value_group");

    const scopeGroup =
        document.getElementById("offer_scope_group");


    if (type === "free_delivery") {

        valueGroup.style.display = "none";
        scopeGroup.style.display = "none";

    } else {

        valueGroup.style.display = "block";
        scopeGroup.style.display = "block";

    }

    toggleItemSelection();
}


function toggleItemSelection() {

    const type =
        document.getElementById("offer_type").value;

    const selectedScope =
        document.querySelector(
          'input[name="offer_scope"]:checked'
        );

    const box =
        document.getElementById("selected_items_box");


    if (
        type !== "free_delivery" &&
        selectedScope &&
        selectedScope.value === "selected_items"
    ) {

        box.style.display = "block";

    } else {

        box.style.display = "none";

    }
}


function filterOfferItems() {

    const search =
        document
          .getElementById("itemSearch")
          .value
          .toLowerCase()
          .trim();

    const rows =
        document.querySelectorAll(".offer-item-row");


    rows.forEach(row => {

        const name = row.dataset.name || "";

        row.style.display =
            name.includes(search)
              ? "flex"
              : "none";
    });
}


document
  .getElementById("offer_type")
  .addEventListener(
    "change",
    toggleOfferFields
  );


toggleOfferFields();

</script>

</body>
</html>
