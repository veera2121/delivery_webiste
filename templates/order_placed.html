<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Order Placed</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  margin:0;
  font-family:Poppins, sans-serif;
  background:linear-gradient(135deg,#fff3e0,#ffe0b2);
  display:flex;
  align-items:center;
  justify-content:center;
  height:100vh;
}

.card{
  background:#fff;
  border-radius:20px;
  padding:40px 30px;
  text-align:center;
  box-shadow:0 20px 50px rgba(0,0,0,.15);
  animation:pop .5s ease;
}

@keyframes pop{
  from{transform:scale(.8);opacity:0}
  to{transform:scale(1);opacity:1}
}

.check{
  width:80px;
  height:80px;
  border-radius:50%;
  background:#4caf50;
  color:#fff;
  font-size:48px;
  display:flex;
  align-items:center;
  justify-content:center;
  margin:0 auto 20px;
  animation:check .6s ease;
}

@keyframes check{
  0%{transform:scale(0)}
  70%{transform:scale(1.2)}
  100%{transform:scale(1)}
}

h1{
  margin:10px 0;
  color:#2e7d32;
}

p{
  color:#555;
  margin-bottom:15px;
}

.timer{
  font-weight:600;
  color:#ff5722;
}
</style>
</head>

<body>

<div class="card">
  <div class="check">✓</div>
  <h1>Order Placed!</h1>
  <p>Your order <strong>#{{ order_id }}</strong> has been placed successfully.</p>
  <p>Redirecting to <strong>My Orders</strong> in <span class="timer">5</span> seconds…</p>
</div>
<script>
/* ===============================
   CLEAR CART ITEMS ONLY (KEEP ADDRESS)
================================ */

let carts = JSON.parse(localStorage.getItem("carts")) || {};

// Clear items for ALL restaurants (safe after order)
Object.keys(carts).forEach(rid => {
    carts[rid].items = [];
});

localStorage.setItem("carts", JSON.stringify(carts));

console.log("✅ Cart items cleared, address untouched");
</script>

<script>
/* ===============================
   REDIRECT TIMER
================================ */
let time = 5;
const timerEl = document.querySelector(".timer");

const interval = setInterval(() => {
  time--;
  timerEl.innerText = time;

  if (time <= 0) {
    clearInterval(interval);
    window.location.href = "{{ url_for('myorders') }}";
  }
}, 1000);
</script>

</body>
</html>

</body>
</html>
