<h2>🏅 Reward Badge Settings</h2>

<form method="post">

<table class="table">
  <tr>
    <th>Badge</th>
    <th>Required Coins</th>
    <th>Benefits</th>
  </tr>

  {% for b in badges %}
  <tr>
    <td>{{ b.name }}</td>

    <td>
      <input type="number"
             name="coins_{{ b.id }}"
             value="{{ b.required_coins }}"
             min="0"
             class="form-control">
    </td>

    <td>{{ b.benefits }}</td>
  </tr>
  {% endfor %}

</table>

<button class="btn btn-success">
  Save Changes
</button>

</form>
